name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: "${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.event.head_commit.message, 'chore: release') }}"
    steps:
      - run: echo "Conditions met. Proceeding with publish."

  packages:
    needs: check
    if: "${{ github.event_name == 'push' }}"
    uses: sehv-oss/actions/.github/workflows/publish-node-pnpm.yaml@v1
    secrets: inherit

  pages:
    needs: check
    uses: ./.github/workflows/publish-page.yaml
    secrets: inherit
